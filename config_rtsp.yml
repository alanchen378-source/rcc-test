# RTSP 流与 ROI 配置示例
streams:
  - uuid: "camera-1"
    name: "Gate A"
    rtsp_url: "rtsp://example.com/stream1"
    rois:
      - uuid: "roi-1"
        room_uuid: "room-1"
        polygon: [[100, 100], [200, 100], [200, 200], [100, 200]]
        arrow:
          start: [120, 150]
          end: [180, 150]
  - uuid: "camera-2"
    name: "Gate B"
    rtsp_url: "rtsp://example.com/stream2"
    rois:
      - uuid: "roi-2"
        room_uuid: "room-2"
        polygon: [[50, 50], [250, 50], [250, 250], [50, 250]]
        arrow:
          start: [60, 150]
          end: [240, 150]
