{% extends 'base.html' %}
{% block content %}
<section class="section-header">
    <div>
        <h2>人员列表</h2>
        <p>维护人员库，后续可扩展上传人脸照片和备注信息。</p>
    </div>
    <a class="btn" href="/admin/people/new">新增人员</a>
</section>
<table>
    <thead>
        <tr>
            <th>姓名</th>
            <th>备注</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for person in people %}
        <tr>
            <td>{{ person.name }}</td>
            <td>{{ person.remark or '' }}</td>
            <td class="actions">
                <a class="btn secondary" href="/admin/people/{{ person.id }}/edit">编辑</a>
                <form method="post" action="/admin/people/{{ person.id }}/delete" onsubmit="return confirm('确定删除该人员？');">
                    <button type="submit" class="btn danger">删除</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3" class="empty">暂无人员，请先新增。</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
